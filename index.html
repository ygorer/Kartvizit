<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kartvizit</title>
  <meta name="description" content="Dijital kartvizit: kartını QR ile paylaş, tanıştığın kişileri kaydet ve iPhone Kişiler'e ekle. Veriler sadece telefonunda.">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kartvizit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; frame-src 'none'; manifest-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="topTitle">Kartvizit</h1>
    <button id="eventPill" class="event-pill hidden" data-act="go" data-view="events"></button>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Ana menü">
    <button data-act="go" data-view="card" class="tab"><span class="ti">🪪</span><span>Kartım</span></button>
    <button data-act="go" data-view="contacts" class="tab"><span class="ti">👥</span><span>Kişiler</span></button>
    <button data-act="add-menu" class="tab tab-add" aria-label="Kişi ekle"><span class="plus">+</span></button>
    <button data-act="go" data-view="events" class="tab"><span class="ti">📅</span><span>Etkinlik</span></button>
    <button data-act="go" data-view="settings" class="tab"><span class="ti">⚙️</span><span>Ayarlar</span></button>
  </nav>

  <div id="layers"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="fileCard" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileQR" accept="image/*" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
  <input type="file" id="fileRestore" accept="application/json,.json" hidden>

  <noscript>Bu uygulama JavaScript gerektirir.</noscript>
  <script src="lib/qrcode.js"></script>
  <script src="lib/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
